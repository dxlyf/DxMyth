    precision highp float;
    uniform vec3        iResolution;
uniform float       iTime;
uniform float       iTimeDelta;
uniform int         iFrame;

uniform vec3        iChannelResolution[10];
uniform vec4        iMouse;

// 四元数与四元数相乘的函数
vec4 quatMultiply(vec4 q1, vec4 q2) {
    vec4 result;
    // 计算新的实部
    result.w = q1.w * q2.w - dot(q1.xyz, q2.xyz);
   
    // 计算新的虚部 (x, y, z)
    result.xyz = q1.w * q2.xyz + q2.w * q1.xyz + cross(q1.xyz, q2.xyz);

    return result;
}

// 四元数和虚四元数相乘
vec4 multiplyImaginaryQuaternions(vec4 q,vec4 vq){
	
	vec4 qv;
    	qv.w = -dot(q.xyz, vq.xyz);  // 计算实部
    	qv.xyz = q.w * vq.xyz + cross(q.xyz, vq.xyz);  // 计算虚部
	return qv;
}

// v 向量转纯虚四元数 q=(0,v.x,v.y,v.z)
// v'=q*vq*p^-1
vec3 applyQuat2(vec4 q,vec3 v){
	vec4 qInverse=vec4(-q.xyz,q.w);
	vec4 vq=vec4(v,0);
	vec4 qv=quatMultiply(q,vq);
	vec4 qvi=quatMultiply(qv,qInverse);
	return qvi.xyz;
}

// 绕任意轴旋转的四元数
vec4 quatFromAxis(vec3 axis, float angle) {
    float halfAngle = angle * 0.5;
    float s = sin(halfAngle);
    return vec4(-normalize(axis) * s, cos(halfAngle)); // x, y, z (虚部), w (实部)
}

// 从欧拉角任意顺序生成四元数
vec4 quatFromEulerOrder(vec3 euler, ivec3 order) {
   
    
    vec4 xAxis=quatFromAxis(vec3(1,0,0),euler.x);
    vec4 yAxis=quatFromAxis(vec3(0,1,0),euler.y);
    vec4 zAxis=quatFromAxis(vec3(0,0,1),euler.z);

    // 获取顺序索引：order.x 是第一个旋转的轴，order.z 是最后一个
    vec4 q[3] = vec4[3](xAxis, yAxis, zAxis);

    // 按照 order 指定的顺序相乘（从最后一个旋转开始向左乘）
    // 例如 order=XYZ(0,1,2)：先转X(0)，再转Y(1)，最后转Z(2)
    // 那么合成四元数应为：q[2] * q[1] * q[0]
    vec4 result = quatMultiply(q[order.y],q[order.z]); // 先乘最后两个
    result = quatMultiply(q[order.x],result); // 再乘第一个
    return result;
}
// 从欧拉角生成四元数
vec4 quatFromEuler(vec3 euler) {
    return quatFromEulerOrder(euler,ivec3(0,1,2));
}


// 四元数乘法
vec4 quatMultiply2(vec4 q1, vec4 q2) {
    return vec4(
        q1.w * q2.x + q1.x * q2.w + q1.y * q2.z - q1.z * q2.y,  // x
        q1.w * q2.y + q1.y * q2.w + q1.z * q2.x - q1.x * q2.z,  // y
        q1.w * q2.z + q1.z * q2.w + q1.x * q2.y - q1.y * q2.x,  // z
        q1.w * q2.w - q1.x * q2.x - q1.y * q2.y - q1.z * q2.z   // w
    );
}
// 四元数乘法
vec4 quatMultiply3(vec4 q1, vec4 q2) {
    // 四元数乘法
    vec4 q;
    q.w=q1.w*q2.w-dot(q1.xyz,q2.xyz); 
    q.xyz=q1.w*q2.xyz+q2.w*q1.xyz+cross(q1.xyz,q2.xyz);
    return q;
}
// 四元数的共轭
vec4 quatConjugate(vec4 q) {
    return vec4(-q.x, -q.y, -q.z, q.w); // 共轭的四元数
}

// 四元数的长度
float quatLength(vec4 q) {
    return sqrt(dot(q, q)); // 四元数的长度
}

// 四元数的逆
vec4 quatInverse(vec4 q) {
    return quatConjugate(q) / quatLength(q); // 四元数的逆
}


// 生成纯虚四元数
vec4 quatFromVector(vec3 v) {
    return vec4(v, 0.0); // 实部为0，虚部为向量v
}
mat3 quatToMat3(vec4 q) { // 输入 q 必须是单位四元数
    float x = q.x, y = q.y, z = q.z, w = q.w;

    // 计算这些中间变量可优化性能（避免重复计算平方项）
    float xx = x * x, yy = y * y, zz = z * z;
    float xy = x * y, xz = x * z, yz = y * z;
    float wx = w * x, wy = w * y, wz = w * z;

    mat3 m;
    // 第一列：旋转后的X轴 (即用q旋转向量(1, 0, 0)的结果)
    m[0][0] = 1.0 - 2.0 * (yy + zz); // 1 - 2y² - 2z²
    m[1][0] = 2.0 * (xy + wz);       // 2xy + 2zw
    m[2][0] = 2.0 * (xz - wy);       // 2xz - 2yw

    // 第二列：旋转后的Y轴 (即用q旋转向量(0, 1, 0)的结果)
    m[0][1] = 2.0 * (xy - wz);       // 2xy - 2zw
    m[1][1] = 1.0 - 2.0 * (xx + zz); // 1 - 2x² - 2z²
    m[2][1] = 2.0 * (yz + wx);       // 2yz + 2xw

    // 第三列：旋转后的Z轴 (即用q旋转向量(0, 0, 1)的结果)
    m[0][2] = 2.0 * (xz + wy);       // 2xz + 2yw
    m[1][2] = 2.0 * (yz - wx);       // 2yz - 2xw
    m[2][2] = 1.0 - 2.0 * (xx + yy); // 1 - 2x² - 2y²

    // 在GLSL中，mat3构造函数按列填充，所以也可以这样写：
    // mat3 m = mat3(
    //     1-2*(yy+zz),  2*(xy+wz),   2*(xz-wy),
    //     2*(xy-wz),   1-2*(xx+zz),  2*(yz+wx),
    //     2*(xz+wy),   2*(yz-wx),   1-2*(xx+yy)
    // );
    return m;
}
// 从旋转矩阵提取四元数
vec4 quatFromRotationMatrix(mat4 m) {
    float trace = m[0][0] + m[1][1] + m[2][2];
    vec4 q;
    if (trace > 0.0) {
        float s = sqrt(trace + 1.0) * 2.0;
        q.w = 0.25 * s;
        q.x = (m[2][1] - m[1][2]) / s;
        q.y = (m[0][2] - m[2][0]) / s;
        q.z = (m[1][0] - m[0][1]) / s;
    } else if ((m[0][0] > m[1][1]) && (m[0][0] > m[2][2])) {
        float s = sqrt(1.0 + m[0][0] - m[1][1] - m[2][2]) * 2.0;
        q.w = (m[2][1] - m[1][2]) / s;
        q.x = 0.25 * s;
        q.y = (m[0][1] + m[1][0]) / s;
        q.z = (m[0][2] + m[2][0]) / s;
    } else if (m[1][1] > m[2][2]) {
        float s = sqrt(1.0 + m[1][1] - m[0][0] - m[2][2]) * 2.0;
        q.w = (m[0][2] - m[2][0]) / s;
        q.x = (m[0][1] + m[1][0]) / s;
        q.y = 0.25 * s;
        q.z = (m[1][2] + m[2][1]) / s;
    } else {
        float s = sqrt(1.0 + m[2][2] - m[0][0] - m[1][1]) * 2.0;
        q.w = (m[1][0] - m[0][1]) / s;
        q.x = (m[0][2] + m[2][0]) / s;
        q.y = (m[1][2] + m[2][1]) / s;
        q.z = 0.25 * s;
    }
    return q;
}

// 四元数插值（球面线性插值, Slerp）
vec4 quatSlerp(vec4 q1, vec4 q2, float t) {
    float dotProd = dot(q1, q2);
    if (dotProd < 0.0) {
        q2 = -q2;
        dotProd = -dotProd;
    }
    const float THRESHOLD = 0.9995;
    if (dotProd > THRESHOLD) {
        return normalize(q1 + t * (q2 - q1));
    }
    float theta = acos(dotProd);
    float sinTheta = sin(theta);
    return (sin((1.0 - t) * theta) * q1 + sin(t * theta) * q2) / sinTheta;
}

// 计算两个四元数之间的夹角
float quatAngleBetween(vec4 q1, vec4 q2) {
    return 2.0 * acos(abs(dot(q1, q2)));
}

// 用四元数旋转向量
// q*p*q^-1 = q*p*q^-1

vec3 applyQuat(vec3 v,vec4 q) {
    //将v定义下纯四元数
    vec4 p=vec4(v,0);
    // 
    vec4 qi=quatInverse(q);
    return quatMultiply(quatMultiply(q,p),qi).xyz;
}

// 球体的半径
#define SPHERE_R 1.0
// 球体的漫反射系数
#define SPHERE_KD vec3(1)

// 相机视点位
#define CAMERA_POS vec3(0, 1.5, 0)
// 相机目标点
#define CAMERA_TARGET vec3(0, 1, -5)
// 上方向
#define CAMERA_UP vec3(0, 1, 0)

// 光线推进的起始距离 
#define RAYMARCH_NEAR 0.1
// 光线推进的最远距离
#define RAYMARCH_FAR 128.
// 光线推进次数
#define RAYMARCH_TIME 512
// 当推进后的点位距离物体表面小于RAYMARCH_PRECISION时，默认此点为物体表面的点
#define RAYMARCH_PRECISION 0.001 

// 点光源位置
#define LIGHT_POS vec3(3,4, -1)

// 相邻点的抗锯齿的行列数
#define AA 3

// 投影坐标系
vec2 ProjectionCoord(in vec2 coord) {
  return PROJECTION_SCALE * 2. * (coord - 0.5 * iResolution.xy) / min(iResolution.x, iResolution.y);
}

//球体的SDF模型
float SDFSphere(vec3 coord) {
  return length(coord - SPHERE_POS) - SPHERE_R;
}

// 水平面的SDF模型
float SDFPlane(vec3 coord) {
  return coord.y;
}

// 所有的SDF模型
float SDFAll(vec3 coord) {
  return min(SDFSphere(coord), SDFPlane(coord));
}

// 计算球体的法线
vec3 SDFNormal(in vec3 p) {
  const float h = 0.0001;
  const vec2 k = vec2(1, -1);
  return normalize(k.xyy * SDFAll(p + k.xyy * h) +
    k.yyx * SDFAll(p + k.yyx * h) +
    k.yxy * SDFAll(p + k.yxy * h) +
    k.xxx * SDFAll(p + k.xxx * h));
}

// 视图旋转矩阵
mat3 RotateMatrix() {
  //基向量c，视线
  vec3 c = normalize(CAMERA_POS - CAMERA_TARGET);
  //基向量a，视线和上方向的垂线
  vec3 a = cross(CAMERA_UP, c);
  //基向量b，修正上方向
  vec3 b = cross(c, a);
  //正交旋转矩阵
  return mat3(a, b, c);
}

// 光线推进数据的结构体
struct RayMarchData {
  vec3 pos;
  bool crash;
};

// 将RayMarch与渲染分离
RayMarchData RayMarch(vec3 ro, vec3 rd) {
  float d = RAYMARCH_NEAR;
  // 光线推进次数
  RayMarchData rm;
  rm = RayMarchData(ro, false);
  for(int i = 0; i < RAYMARCH_TIME && d < RAYMARCH_FAR; i++) {
    // 光线推进后的点位
    vec3 p = ro + d * rd;
    // 光线推进后的点位到模型的有向距离
    float curD = SDFAll(p);
    // 若有向距离小于一定的精度，默认此点在模型表面
    if(curD < RAYMARCH_PRECISION) {
      rm = RayMarchData(p, true);
      break;
    }
    // 距离累加
    d += curD;
  }
  return rm;
}

// 投影
float Shadow(in vec3 ro, in vec3 rd) {
  for(float t = RAYMARCH_NEAR; t < RAYMARCH_FAR;) {
    float h = SDFAll(ro + rd * t);
    if(h < 0.001) {
      return 0.0;
    }
    t += h;
  }
  return 1.0;
}

// 软投影
float SoftShadow(in vec3 ro, in vec3 rd, float k) {
  float res = 1.;
  for(float t = RAYMARCH_NEAR; t < RAYMARCH_FAR;) {
    float h = SDFAll(ro + rd * t);
    if(h < RAYMARCH_PRECISION) {
      return 0.;
    }
    res = min(res, k * h / t);
    t += h;
  }
  return res;
}

// 打光
vec3 AddLight(vec3 positon) {
  // 当前着色点的法线
  vec3 n = SDFNormal(positon);
  // 当前着色点到光源的方向
  vec3 lightDir = normalize(LIGHT_POS - positon);
  // 漫反射
  vec3 diffuse = SPHERE_KD * max(dot(lightDir, n), 0.);
  // 投影
  // float shadow = Shadow(positon, normalize(LIGHT_POS - positon));
  float shadow = SoftShadow(positon, normalize(LIGHT_POS - positon), 8.);
  diffuse *= shadow * 0.5 + 0.5;

  // 环境光
  float amb = 0.2 + dot(-lightDir, n) * 0.4;
  // 最终颜色
  return diffuse + amb;
}

// 渲染
vec3 Render(vec2 coord) {

  // 从相机视点到当前片元的射线
  RayMarchData rm = RayMarch(CAMERA_POS, normalize(RotateMatrix() * vec3(coord, -1)));
  // 片元颜色
  vec3 color = vec3(0);
  if(rm.crash) {
    vec3 p = rm.pos;
    // 打光
    color = AddLight(p);

  }
  return color;
}

// 抗锯齿 Anti-Aliasing
vec3 Render_anti(vec2 fragCoord) {
  // 初始颜色
  vec3 color = vec3(0);
  // 行列的一半
  float aa2 = float(AA / 2);
  // 逐行列遍历
  for(int y = 0; y < AA; y++) {
    for(int x = 0; x < AA; x++) {
      // 基于像素的偏移距离
      vec2 offset = vec2(float(x), float(y)) / float(AA) - aa2;
      // 投影坐标位
      vec2 coord = ProjectionCoord(fragCoord + offset);
      // 累加周围片元的颜色
      color += Render(coord);
    }
  }
  // 返回周围颜色的均值
  return color / float(AA * AA);
}

/* 绘图函数，画布中的每个片元都会执行一次，执行方式是并行的。
fragColor 输出参数，用于定义当前片元的颜色。
fragCoord 输入参数，当前片元的位置，原点在画布左下角，右侧边界为画布的像素宽，顶部边界为画布的像素高
*/
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  // 光线推进
  vec3 color = Render_anti(fragCoord);
  // 最终颜色
  fragColor = vec4(color, 1);
}

void main() {
    vec2 fragCoord = gl_FragCoord.xy;
    mainImage(gl_FragColor, fragCoord);
}

            mouseButton.x = 0;
        if (evt.button == 2)
            mouseButton.y = 0;

        dragging = false;
        mouse.z = -mouse.z;
        mouse.w = -mouse.w;

        updateMouse();
    }, false);
    window.addEventListener('resize', function() {
        computeSize();
    });

    // Keyboard Callbacks
</script>
