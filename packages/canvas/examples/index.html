<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DxMyth Canvas Examples</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            font-weight: 500;
            margin-bottom: 8px;
        }
        .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }
        ul {
            list-style: none;
            padding: 0;
            width: 100%;
            max-width: 480px;
        }
        li {
            margin: 8px 0;
        }
        a {
            display: block;
            padding: 14px 18px;
            background: #1f1f1f;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #4af;
            text-decoration: none;
            transition: background .15s, border-color .15s;
        }
        a:hover {
            background: #262626;
            border-color: #3a3a3a;
        }
        a .desc {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h1>@dxyl/canvas Examples</h1>
    <p class="sub">点击进入对应示例</p>
    <ul>
        <li>
            <a href="./bool/index.html">
                Path Boolean
                <span class="desc">路径布尔运算：union / intersect / difference / xor</span>
            </a>
        </li>
        <li>
            <a href="./path/index.html">
                Path / Stroke / Hit
                <span class="desc">PathBuilder 绘制 + 包围盒 + PathStroke 描边 + isPointInPath 命中测试</span>
            </a>
        </li>
    </ul>
</body>
</html>
