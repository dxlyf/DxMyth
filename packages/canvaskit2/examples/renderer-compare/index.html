<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanvasRenderer vs CanvasKitRenderer 对比</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", sans-serif;
            background: #1e1e1e;
            color: #ddd;
            padding: 20px;
        }
        h1 { font-size: 18px; margin-bottom: 16px; font-weight: 600; }
        .panels { display: flex; gap: 24px; flex-wrap: wrap; }
        .panel {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .panel-title { font-size: 15px; font-weight: 600; }
        .panel-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #3a3a3a;
            color: #aaa;
        }
        .panel-tag.canvas { color: #4fc3f7; }
        .panel-tag.canvaskit { color: #ffb74d; }
        .panel-container {
            position: relative;
            width: 420px;
            height: 420px;
            border-radius: 4px;
            overflow: hidden;
        }
        .legend {
            margin-top: 18px;
            font-size: 12px;
            color: #888;
            line-height: 1.6;
            max-width: 880px;
        }
    </style>
</head>
<body>
    <h1>CanvasRenderer vs CanvasKitRenderer 渲染对比</h1>
    <div class="panels">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Canvas 2D</span>
                <span class="panel-tag canvas">renderType: 'canvas'</span>
            </div>
            <div id="canvas-panel" class="panel-container"></div>
        </div>
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">CanvasKit (Skia WASM)</span>
                <span class="panel-tag canvaskit">renderType: 'canvaskit'</span>
            </div>
            <div id="canvaskit-panel" class="panel-container"></div>
        </div>
    </div>
    <div class="legend">
        两侧渲染相同的场景，包含：strokeAlign(center/outside/inside)、圆角矩形、椭圆、五角星、线性渐变、文本、虚线折线、旋转动画组、半透明元素。两者应视觉一致。
    </div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
